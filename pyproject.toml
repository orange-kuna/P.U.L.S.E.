[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "orange-kuna", email = "itachi.umbarje@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
